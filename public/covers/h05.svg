    <path d="M-109-29Q-173-41-158 15Q-150 43-125 39M109-29Q173-41 158 15Q150 43 125 39" fill="none" stroke="#997449" stroke-width="12"/>
    <text y="20" text-anchor="middle" font-family="sans-serif" font-size="66" font-weight="800" fill="#fff7e6">?</text>
